<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Instructor Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121212, #1c1c1c);
            color: #e0e0e0;
            margin: 0;
            padding: 20px 0;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h3 {
            color: #ffffff;
            border-bottom: 2px solid #444;
            padding-bottom: 6px;
            margin-top: 25px;
        }

        p#userInfo {
            text-align: center;
            color: #cccccc;
            margin-bottom: 20px;
        }

        /* Dashboard cards */
        #instructorContent,
        #pendingInstructorUpload {
            background-color: rgba(30, 30, 30, 0.95);
            padding: 25px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 900px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        /* Lists */
        ul {
            list-style: none;
            padding-left: 0;
            margin-top: 10px;
        }

        ul li {
            background-color: #2a2a2a;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #2a2a2a;
        }

        table th,
        table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #555;
        }

        table th {
            background-color: #3a3a3a;
        }

        /* Form styling */
        form label {
            display: block;
            margin-top: 12px;
            font-weight: 500;
            color: #cccccc;
        }

        form input[type="text"],
        form input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #2f2f2f;
            color: #e0e0e0;
            font-size: 14px;
        }

        form input[type="text"]:focus,
        form input[type="file"]:focus {
            border: 1px solid #8c00ff;
            outline: none;
            background-color: #3a3a3a;
        }

        button {
            background: linear-gradient(135deg, #6a00f4, #8c00ff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #8c00ff, #6a00f4);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        #uploadMessage {
            margin-top: 10px;
            font-size: 14px;
            color: green;
        }

        @media (max-width: 600px) {

            #instructorContent,
            #pendingInstructorUpload {
                padding: 20px;
            }

            table th,
            table td {
                padding: 8px;
            }
        }

        ul#allSessions li,
        ul#pendingApprovals li,
        ul#scheduledSessions li {
            background: #2d2d2d;
            margin-bottom: 12px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            cursor: default;
        }

        ul#allSessions li:hover,
        ul#pendingApprovals li:hover,
        ul#scheduledSessions li:hover {
            background: #3a3a3a;
            transform: scale(1.02);
        }

        /* Optionally you can also apply to other lists for uniformity */
        ul li {
            list-style: none;
            padding-left: 0;
        }

        #LOGOUT {
            display: block;
            /* make it a block element */
            margin: 50px auto;
            /* top/bottom 50px, horizontally centered */
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background-color: #8c00ff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #LOGOUT:hover {
            background-color: #8c00ff;
        }
    </style>
</head>

<body>

    <h2>Instructor Dashboard</h2>
    <p id="userInfo"></p>

    <!-- Main dashboard content for approved instructors -->
    <div id="instructorContent" style="display: none;">

        <h3>Pending Approvals (student requests)</h3>
        <ul id="pendingApprovals"></ul>

        <h3>Scheduled sessions</h3>
        <ul id="scheduledSessions"></ul>

        <h3>ALL SESSIONS</h3>
        <ul id="allSessions"></ul>
    </div>

    <!-- Upload form for pending instructors -->
    <div id="pendingInstructorUpload" style="display: none;">
        <h3>Upload your certifications and demo materials</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <label>Certifications (PDF/Image):</label>
            <input type="file" name="certifications" multiple>

            <label>Demo Materials (PDF/Image/Video):</label>
            <input type="file" name="demo_material" multiple>

            <label>Subjects you teach (comma separated):</label>
            <input type="text" name="subject_tags" placeholder="Math, Physics, Chemistry">

            <label>Education Levels you teach (comma separated):</label>
            <input type="text" name="education_level_tags" placeholder="High School, Undergraduate">

            <button type="submit">Submit Profile</button>
        </form>
        <p id="uploadMessage"></p>
    </div>

    <button id="LOGOUT">Logout</button>

    <script>
        document.getElementById("LOGOUT").addEventListener("click", () => {
            localStorage.removeItem("jwt");
            window.location.href = "/shared/login.html";
        });
    </script>
    <script src="dashboard_instructor.js"></script>
</body>

</html>
