<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Session</title>
    <style>
        .instructor-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .demo-material-list {
            list-style-type: none;
            padding-left: 0;
        }

        .demo-material-list li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <h2>Create Session</h2>

    <!-- SESSION BASIC INFO -->
    <label>Session Description</label><br>
    <textarea id="session_desc"></textarea><br><br>

    <label>Start Time</label><br>
    <input type="datetime-local" id="start_time"><br><br>

    <label>Duration (minutes)</label><br>
    <input type="number" id="duration_minutes" min="1"><br><br>

    <label>Selected Instructor ID</label><br>
    <input type="text" id="selected_instructor" readonly><br><br>

    <h3>Filter Instructors (Leave empty for no filters)</h3>

    <label>Subject Tags (comma-separated)</label><br>
    <input type="text" id="subject_tags"><br><br>

    <select id="time_zone">
        <option value="">Select Time Zone</option>
    </select><br><br>

    <button id="filter_btn">Filter</button>

    <h3>Matching Instructors</h3>
    <div id="filter-results"></div>

    <br><br>
    <button id="submit_btn">Send Session Request</button>

    <script src="book_session.js"></script>
</body>

</html>
