<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Student Dashboard</title>

  <style>
    /* Global body */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #userInfo {
      text-align: center;
      color: #b0b0b0;
      margin-bottom: 20px;
      font-style: italic;
    }

    /* Card layout */
    #studentContent,
    #studentProfileForm {
      background: rgba(30, 30, 30, 0.95);
      width: 90%;
      max-width: 700px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    #studentContent:hover,
    #studentProfileForm:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.8);
    }

    h3 {
      color: #ffffff;
      border-bottom: 2px solid #444;
      padding-bottom: 8px;
      margin-top: 25px;
      font-weight: 500;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }

    ul li {
      background: #2d2d2d;
      margin-bottom: 12px;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      transition: background 0.3s, transform 0.2s;
      cursor: default;
    }

    ul li:hover {
      background: #3a3a3a;
      transform: scale(1.02);
    }

    /* Buttons */
    button {
      background: linear-gradient(135deg, #6a00f4, #8c00ff);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    button:hover {
      background: linear-gradient(135deg, #8c00ff, #6a00f4);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }

    #editProfileBtn {
      display: block;
      margin-bottom: 15px;
    }

    #book-ssn-btn {
      display: block;
      margin: 30px auto;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
    }

    /* Profile form */
    form label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
      color: #cccccc;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #555;
      background-color: #2f2f2f;
      color: #e0e0e0;
      font-size: 14px;
      transition: border 0.3s, background 0.3s;
    }

    form input:focus {
      border: 1px solid #8c00ff;
      outline: none;
      background-color: #3a3a3a;
    }

    #profileMessage {
      margin-top: 12px;
      font-size: 14px;
      color: #00e676;
      font-weight: 500;
    }

    /* Responsive tweaks */
    @media (max-width: 500px) {

      #studentContent,
      #studentProfileForm {
        padding: 20px;
      }

      button {
        width: 100%;
      }
    }

    #LOGOUT {
      display: block;
      /* make it a block element */
      margin: 50px auto;
      /* top/bottom 50px, horizontally centered */
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      background-color: #ff4d4d;
      color: white;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    #LOGOUT:hover {
      background-color: #e60000;
    }
  </style>
</head>

<body>
  <h2>Student Dashboard</h2>
  <p id="userInfo"></p>

  <!-- Dashboard content -->
  <div id="studentContent">
    <button id="editProfileBtn">Update Profile</button>

    <h3>Sessions Pending Payment</h3>
    <ul id="pendingPaymentSessions"></ul>

    <h3>Scheduled sessions</h3>
    <ul id="scheduledSessions"></ul>

    <h3>All Sessions</h3>
    <ul id="allSessions"></ul>
  </div>

  <!-- Profile form for first-time students -->
  <div id="studentProfileForm" style="display:none">
    <h3>Complete Your Profile</h3>

    <form id="profileForm">
      <label>Education Level:</label>
      <input type="text" name="education_level" required />

      <label>Subjects (comma separated):</label>
      <input type="text" name="subject_tags" required />

      <button type="submit">Save Profile</button>
    </form>

    <p id="profileMessage"></p>
  </div>

  <button id="book-ssn-btn">Book Session</button>
  <button id="LOGOUT">Logout</button>

  <script>
    document.getElementById("LOGOUT").addEventListener("click", () => {
      localStorage.removeItem("jwt");
      window.location.href = "/shared/login.html";
    });
  </script>
  <script src="dashboard_student.js"></script>
</body>

</html>
