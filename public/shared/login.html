<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnSync Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-page-container">
    <a href="../index.html" class="back-to-home btn btn-outline-white">
      ← Back to Home
    </a>
    
    <div class="form-container">
      <div class="card-header">
        <h2 class="auth-title">Login to LearnSync</h2>
        <p class="auth-subtitle">Welcome back! Please login to continue</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter your password">
        </div>
        
        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <p style="color: var(--text-light);">Don't have an account? 
          <a href="signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up here</a>
        </p>
      </div>

      <p id="message" class="message hidden"></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
